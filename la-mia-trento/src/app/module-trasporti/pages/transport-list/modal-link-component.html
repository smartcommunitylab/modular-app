<ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-button class="interaction" (click)="closeModal()">
          <ion-icon name="arrow-back"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>
        Orari
        </ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-content>
    <ion-list>
      <ion-item *ngFor="let item of links">
        <ion-label>{{item.title}}</ion-label>
        <ion-label>              <div (click)="openLink(item.url)">
       Apri orario </div></ion-label>
      </ion-item>
    </ion-list>
  
  </ion-content>
